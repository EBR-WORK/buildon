<!doctype html>
<meta charset="utf-8" />
<title>measure</title>
<style>
  body { margin: 0; font: 13px monospace; }
  iframe { width: 390px; height: 800px; border: 0; }
</style>
<iframe id="f" src="/"></iframe>
<pre id="out">pending</pre>
<script>
  const f = document.getElementById("f");
  function measure() {
    {
      const d = f.contentDocument;
      const doc = d.documentElement;
      const lines = [];
      lines.push("viewport=390 scrollWidth=" + doc.scrollWidth);
      const offenders = [];
      d.querySelectorAll("*").forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.right > 391 && r.width > 0) {
          offenders.push({
            right: Math.round(r.right),
            width: Math.round(r.width),
            tag: el.tagName.toLowerCase(),
            cls: (el.getAttribute("class") || "").slice(0, 110),
          });
        }
      });
      offenders.sort((a, b) => b.right - a.right);
      offenders.slice(0, 14).forEach((o) => {
        lines.push("right=" + o.right + " w=" + o.width + " <" + o.tag + "> " + o.cls);
      });
      document.getElementById("out").textContent = lines.join("\n");
    }
  }
  f.addEventListener("load", measure);
  window.addEventListener("load", measure);
</script>
